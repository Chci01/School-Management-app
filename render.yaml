services:
  - type: web
    name: school-management-backend
    runtime: node
    rootDir: backend-core
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DIRECT_URL
        value: postgresql://neondb_owner:npg_Ddeonqv64MAZ@ep-bitter-waterfall-aq4cj5ra.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_Ddeonqv64MAZ@ep-bitter-waterfall-aq4cj5ra.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: PORT
        value: 3000

  - type: web
    name: school-management-frontend
    env: static
    rootDir: frontend-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


