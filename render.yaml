services:
  - type: web
    name: school-management-backend
    runtime: node
    rootDir: backend-core
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DIRECT_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: PORT
        value: 3000

  - type: web
    name: school-management-frontend
    env: static
    rootDir: frontend-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: school-management-db
    databaseName: school_db
    user: admin
    plan: free
