services:
  - type: web
    name: school-management-backend
    runtime: node
    rootDir: backend-core
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DIRECT_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: PORT
        value: 3000

databases:
  - name: school-management-db
    databaseName: school_db
    user: admin
    plan: free
